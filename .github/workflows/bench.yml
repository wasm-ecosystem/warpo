name: bench

on:
  pull_request:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Save bootstrap release script
        run: |
          cp tests/bootstrap/release.sh "$RUNNER_TEMP/bootstrap-release.sh"
          chmod +x "$RUNNER_TEMP/bootstrap-release.sh"

      - uses: ./.github/action/build
        with:
          OS_ID: ubuntu-latest
          UPLOAD_CACHE: false
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release"

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run bootstrap release for PR merge commit
        run: "$RUNNER_TEMP/bootstrap-release.sh"
        env:
          BOOTSTRAP_RELEASE_SKIP_THIRD: "1"

      - name: Record PR merge commit size
        id: merge-size
        shell: bash
        run: |
          set -euo pipefail
          echo "bootstrap=$(stat -c%s tests/bootstrap/tmp/release/assemblyscript.warpo-test-bootstrap.wasm)" >> "$GITHUB_OUTPUT"

      - name: Checkout base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          clean: true

      - name: Install base dependencies
        run: npm ci

      - uses: ./.github/action/build
        with:
          OS_ID: ubuntu-latest
          UPLOAD_CACHE: false
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Release"

      - name: Build base TypeScript
        run: npm run build:ts

      - name: Run bootstrap release for base commit
        run: "$RUNNER_TEMP/bootstrap-release.sh"
        env:
          BOOTSTRAP_RELEASE_SKIP_THIRD: "1"

      - name: Record base commit size
        id: base-size
        shell: bash
        run: |
          set -euo pipefail
          echo "bootstrap=$(stat -c%s tests/bootstrap/tmp/release/assemblyscript.warpo-test-bootstrap.wasm)" >> "$GITHUB_OUTPUT"

      - name: Create diff
        shell: bash
        run: |
          set -euo pipefail

          base_size='${{ steps.base-size.outputs.bootstrap }}'
          merge_size='${{ steps.merge-size.outputs.bootstrap }}'

          if [[ "$base_size" == "$merge_size" ]]; then
            : > bench.diff
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "-${base_size} bytes"
              echo "+${merge_size} bytes"
            } > bench.diff
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save bench result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-result
          cp bench.diff bench-result/bench.diff
          echo '${{ github.event.pull_request.number }}' > bench-result/pr-number

      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench-result/
          retention-days: 7
