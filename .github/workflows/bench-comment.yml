name: bench comment

on:
  workflow_run:
    workflows: [bench]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-result
          path: ${{ runner.temp }}/bench-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create comment
        id: create-comment
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(cat "${{ runner.temp }}/bench-result/pr-number")
          {
            echo '```diff'
            cat "${{ runner.temp }}/bench-result/bench.diff"
            echo '```'
          } > "${{ runner.temp }}/bench-result/comment.md"
          echo "pr-number=$pr_number" >> "$GITHUB_OUTPUT"

      - uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: ${{ runner.temp }}/bench-result/comment.md
          pr-number: ${{ steps.create-comment.outputs.pr-number }}
          comment-tag: bench
