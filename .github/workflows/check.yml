name: check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label ||
    github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build_release_only:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: ./.github/action/build
        with:
          CMAKE_ARGS: "-DWARPO_RELEASE=ON -DCMAKE_BUILD_TYPE=Release"
          OS_ID: ${{ matrix.os }}
      - run: npm run build:ts
      # enable docs is available
      - run: npm run docs:build

  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git to preserve line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: ./.github/action/build
        with:
          OS_ID: ${{ matrix.os }}
          CMAKE_ARGS: ${{ matrix.os == 'ubuntu-latest' && '-DCMAKE_BUILD_TYPE=RelWithDebInfo -DWARPO_SANITIZE=ON' || '-DCMAKE_BUILD_TYPE=RelWithDebInfo' }}
      - run: npm run build:ts
      - run: npm run build:parser:ts
      # test
      - run: npm run test:as:ut
      - run: npm run test:cpp:ut
      - run: npm run test:opt:snapshot -- --debug
      - run: npm run test:as:snapshot
      - run: npm run test:debug_symbol
      - run: npm run test:driver
      - run: npm run test:heap_analyzer

  bootstrap:
    strategy:
      matrix:
        kind: [debug, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: ./.github/action/build
        with:
          OS_ID: ubuntu-latest
          UPLOAD_CACHE: false
      - run: npm run build:ts
      - run: npm run test:bootstrap:${{ matrix.kind }}
